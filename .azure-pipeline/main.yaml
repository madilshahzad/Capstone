trigger: none

# Import variables from the variable group "capstone-prod"
variables:
  - group: capstone-prod

pool:
  name: 'Capstone-VM'

stages:
  - stage: Checkout
    displayName: 'Checkout Code'
    jobs:
      - job: CheckoutJob
        displayName: 'Checkout Repository'
        steps:
          - checkout: self
            displayName: 'Checkout Code from Repository'

  - stage: Build
    displayName: 'Build Maven Application'
    dependsOn: Checkout
    jobs:
      - job: BuildJob
        displayName: 'Build and Package Application'
        steps:
          - script: |
              echo "Building the project with Maven..."
              mvn clean package $(mavenOptions)
            displayName: 'Build the Maven Project'
            workingDirectory: $(Build.SourcesDirectory)

  - stage: BuildDockerImage
    displayName: 'Build Docker Image'
    dependsOn: Build
    jobs:
      - job: DockerBuildJob
        displayName: 'Build Docker Image for Application'
        steps:
          - script: |
              echo "Building Docker Image..."
              docker build -t $(dockerImageName):$(Build.BuildId) .
            displayName: 'Build Docker Image'

  - stage: PushToECR
    displayName: 'Push Docker Image to ECR'
    dependsOn: BuildDockerImage
    jobs:
      - job: PushJob
        displayName: 'Authenticate, Tag, and Push Docker Image'
        steps:
          # Authenticate to ECR using the AWS service connection (OIDC-based)
          - task: AWSShellScript@1
            displayName: 'Authenticate to AWS ECR using OIDC'
            inputs:
              awsCredentials: 'AWS-Prod-Connection'
              regionName: '$(awsRegion)'
              scriptType: 'bash'
              script: |
                echo "Authenticating to AWS ECR..."
                export AWS_DEFAULT_REGION=$(awsRegion)
                
                # Verify OIDC authentication by checking AWS identity
                echo "Verifying OIDC authentication..."
                aws sts get-caller-identity --no-cli-pager

                # Authenticate Docker with AWS ECR
                echo "Retrieving AWS ECR login token..."
                aws ecr get-login-password --region $(awsRegion) | docker login --username AWS --password-stdin $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com

                # Check login success
                if [ $? -eq 0 ]; then
                  echo "Successfully authenticated to AWS ECR."
                else
                  echo "AWS ECR authentication failed!" >&2
                  exit 1
                fi

          # Tag the Docker image
          - script: |
              echo "Tagging Docker image..."
              docker tag $(dockerImageName):$(Build.BuildId) $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com/$(ecrRepository):$(Build.BuildId)
            displayName: 'Tag Docker Image'

          # Push the Docker image to ECR
          - script: |
              echo "Pushing Docker image to ECR..."
              docker push $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com/$(ecrRepository):$(Build.BuildId)
              echo "Docker image successfully pushed to ECR!"
            displayName: 'Push Docker Image'


